<div class="container-fluid">
  <div class="container py-2">
    <div class="row mb-4 align-items-center">
      <div class="col-md-6">
        <h3 class="fw-bold text-main m-0">Add New Product</h3>
      </div>
      <div class="col-md-6 text-md-end mt-3 mt-md-0">
        <button class="btn btn-primary fw-bold shadow-sm px-4" (click)="openAddModal()">
          <i class="bi bi-plus-circle me-2"></i>Add New Product
        </button>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                  <tr>
                    <th class="py-3 ps-4 text-muted small text-uppercase fw-bold border-0" style="width: 50%">
                      Item Name
                    </th>
                    <th class="py-3 text-center text-muted small text-uppercase fw-bold border-0" style="width: 25%">
                      Price
                    </th>
                    <th class="py-3 text-center text-muted small text-uppercase fw-bold border-0" style="width: 25%">
                      Actions
                    </th>
                  </tr>
                </thead>

                <tbody>
                  <tr *ngFor="let prod of products">
                    <td class="ps-4 py-3">
                      <div class="d-flex align-items-center">
                        <div class="rounded-3 bg-light d-flex align-items-center justify-content-center me-3 border shadow-sm"
                             style="width: 50px; height: 50px; overflow: hidden">
                          <img *ngIf="prod.imageUrl" [src]="prod.imageUrl" class="img-fluid w-100 h-100" style="object-fit: cover" alt="product" />
                          <i *ngIf="!prod.imageUrl" class="bi bi-image text-secondary fs-4"></i>
                        </div>
                        <div>
                          <h6 class="mb-0 fw-bold text-dark">{{ prod.name }}</h6>
                          <small class="text-muted" style="font-size: 0.8rem">ID: #{{ prod.id }}</small>
                        </div>
                      </div>
                    </td>

                    <td class="fw-bold text-primary text-center">
                      {{ prod.price | currency: "EGP " : "symbol" : "1.0-0" }}
                    </td>

                    <td class="text-center">
                      <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-sm btn-outline-primary border-0 bg-primary-subtle text-primary"
                                (click)="onEdit(prod)" title="Edit">
                          <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger border-0 bg-danger-subtle text-danger"
                                (click)="onDelete(prod.id)" title="Delete">
                          <i class="bi bi-trash-fill"></i>
                        </button>
                      </div>
                    </td>
                  </tr>

                  <tr *ngIf="products.length === 0">
                    <td colspan="3" class="text-center py-5 text-muted">
                      No products found. Click "Add New Product" to start!
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-product-modal 
  [modalId]="'pModal'"
  [isEditing]="isEditing"
  [productForm]="selectedProduct"
  (save)="handleSave($event)">
</app-product-modal>
