<section class="text-container">
  <div class="content-wrapper">
    
    <div class="badge-container">
      <span class="badge-text">{{ badgeText }}</span>
    </div>

    <h1 class="headline">
      Most Powerful Way To<br>
      Connect Every Audience
    </h1>

    <p class="description">
      {{ description }}
    </p>

    <div class="button-group">
      <button class="btn btn-primary" >
        Get Started — For Free!
      </button>
      <button class="btn btn-secondary" >
        Book A Demo
      </button>
    </div>

  </div>
</section>
<div class="gallery-wrapper">
  <div class="gallery-grid">
    
    <div *ngFor="let item of galleryItems" 
         class="gallery-item"
         [class.col-2]="item.cols === 2"
         [class.row-2]="item.rows === 2">
      
      <ng-container *ngIf="item.type === 'video'">
        <div class="video-container">
          <video 
            [src]="item.src" 
            autoplay 
            [muted]="true" 
            loop 
            playsinline>
          </video>
          
        </div>
      </ng-container>
  
      <ng-container *ngIf="item.type === 'image'">
        <img [src]="item.src" class="media-content" alt="gallery item">
      </ng-container>
  
      <div *ngIf="item.badge" class="badge" [ngClass]="item.badgeClass">
        <span *ngIf="item.badge === 'LIVE'" class="dot"></span>
        {{ item.badge }}
        <i *ngIf="item.badge === 'Tutorials'" class="bi bi-play-circle-fill ms-1"></i>
      </div>
  
  
  
    </div>
  
  </div>
</div>
